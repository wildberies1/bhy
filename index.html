<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Милорды - Мессенджер</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark-bg: #0f172a;
            --dark-surface: #1e293b;
            --dark-border: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
        }
        .screen { display: none; height: 100vh; }
        .screen.active { display: flex; }

        /* Login Screen */
        #loginScreen {
            justify-content: center;
            align-items: center;
            background: var(--gradient-1);
            position: relative;
            overflow: hidden;
        }
        #loginScreen::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: bgMove 20s linear infinite;
        }
        @keyframes bgMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        .login-container {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo i {
            font-size: 4rem;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: crownFloat 3s ease-in-out infinite;
        }
        @keyframes crownFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .logo h1 {
            font-size: 2.5rem;
            margin-top: 1rem;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo p { color: var(--text-muted); margin-top: 0.5rem; }
        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .input-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--dark-surface);
            border: 1px solid var(--dark-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--gradient-1);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .btn-secondary {
            padding: 0.75rem 1.5rem;
            background: var(--dark-surface);
            border: 1px solid var(--dark-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover { background: var(--dark-border); }

        /* Main Screen */
        #mainScreen { flex-direction: row; }
        .sidebar {
            width: 320px;
            background: var(--dark-surface);
            border-right: 1px solid var(--dark-border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--dark-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-profile { display: flex; align-items: center; gap: 1rem; }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            background: var(--gradient-1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar.large { width: 100px; height: 100px; }
        .animated-avatar.pulse { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
        }
        .animated-avatar.rotate { animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animated-avatar.bounce { animation: bounce 1s ease-in-out infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animated-avatar.glow { animation: glow 2s ease-in-out infinite; }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
            50% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.8); }
        }
        .animated-avatar.rainbow { animation: rainbow 3s linear infinite; }
        @keyframes rainbow {
            0% { box-shadow: 0 0 20px #ff0000; }
            33% { box-shadow: 0 0 20px #00ff00; }
            66% { box-shadow: 0 0 20px #0000ff; }
            100% { box-shadow: 0 0 20px #ff0000; }
        }
        .user-info h3 { font-size: 1rem; margin-bottom: 0.25rem; }
        .status {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .status.online::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: statusPulse 2s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .settings-btn {
            width: 40px;
            height: 40px;
            background: var(--dark-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .settings-btn:hover {
            background: var(--primary);
            transform: rotate(90deg);
        }
        .sidebar-nav {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .nav-item:hover { background: var(--dark-bg); color: var(--text-primary); }
        .nav-item.active { background: var(--gradient-1); color: white; }
        .nav-item i { width: 20px; }
        .group-info {
            margin-top: auto;
            padding: 1.5rem;
            border-top: 1px solid var(--dark-border);
            text-align: center;
        }
        .group-info h4 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .group-info p { color: var(--text-muted); font-size: 0.9rem; }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--dark-bg);
        }
        .tab-content { display: none; flex-direction: column; height: 100%; }
        .tab-content.active { display: flex; }
        .chat-header {
            padding: 1.5rem;
            background: var(--dark-surface);
            border-bottom: 1px solid var(--dark-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-title { display: flex; align-items: center; gap: 1rem; }
        .crown-icon {
            font-size: 1.5rem;
            background: var(--gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chat-title h2 { font-size: 1.5rem; }
        .typing-indicator {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }
        .chat-actions { display: flex; gap: 0.5rem; }
        .icon-btn {
            width: 40px;
            height: 40px;
            background: var(--dark-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .icon-btn:hover { background: var(--primary); }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .chat-messages::-webkit-scrollbar { width: 8px; }
        .chat-messages::-webkit-scrollbar-track { background: var(--dark-surface); }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--dark-border);
            border-radius: 4px;
        }
        .message {
            display: flex;
            gap: 1rem;
            max-width: 70%;
            animation: messageSlide 0.3s ease-out;
        }
        @keyframes messageSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.own { align-self: flex-end; flex-direction: row-reverse; }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
        }
        .message-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .message-content { display: flex; flex-direction: column; gap: 0.5rem; }
        .message-header { display: flex; align-items: center; gap: 0.5rem; }
        .message-sender { font-weight: 600; font-size: 0.9rem; }
        .message-time { font-size: 0.75rem; color: var(--text-muted); }
        .message-bubble {
            padding: 1rem;
            background: var(--dark-surface);
            border-radius: 15px;
            border-top-left-radius: 5px;
            word-wrap: break-word;
        }
        .message.own .message-bubble {
            background: var(--gradient-1);
            border-top-left-radius: 15px;
            border-top-right-radius: 5px;
        }
        .voice-message {
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 200px;
        }
        .voice-message audio { width: 100%; height: 40px; }
        .circle-message {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
        }
        .circle-message video { width: 100%; height: 100%; object-fit: cover; }
        .system-message {
            align-self: center;
            padding: 0.5rem 1rem;
            background: var(--dark-surface);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            max-width: 100%;
        }

        /* Input Area */
        .chat-input-area {
            padding: 1.5rem;
            background: var(--dark-surface);
            border-top: 1px solid var(--dark-border);
        }
        .input-tools {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tool-btn {
            width: 40px;
            height: 40px;
            background: var(--dark-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tool-btn:hover { background: var(--primary); transform: translateY(-2px); }
        .tool-btn.active { background: var(--primary); }
        .message-input-wrapper {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }
        .message-input-wrapper textarea {
            flex: 1;
            padding: 1rem;
            background: var(--dark-bg);
            border: 1px solid var(--dark-border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            font-family: inherit;
            max-height: 150px;
        }
        .message-input-wrapper textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .send-btn {
            width: 50px;
            height: 50px;
            background: var(--gradient-1);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.1) rotate(15deg); }

        /* Members */
        .members-list {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--dark-surface);
            border-radius: 15px;
            transition: all 0.3s ease;
        }
        .member-item:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-lg);
        }
        .member-info { flex: 1; }
        .member-info h4 { margin-bottom: 0.25rem; }
        .member-info p { font-size: 0.9rem; color: var(--text-muted); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }
        .modal.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: var(--dark-surface);
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlide 0.3s ease-out;
        }
        .modal-content.small { max-width: 400px; }
        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--dark-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h2 { font-size: 1.5rem; }
        .close-btn {
            width: 40px;
            height: 40px;
            background: var(--dark-bg);
            border: none;
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .close-btn:hover { background: var(--danger); }
        .modal-body { padding: 1.5rem; }
        .settings-section { margin-bottom: 2rem; }
        .settings-section h3 { margin-bottom: 1rem; color: var(--text-secondary); }
        .avatar-selector { display: flex; flex-direction: column; gap: 1rem; }
        .current-avatar { display: flex; align-items: center; gap: 1rem; }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 1rem;
            padding: 1rem;
            background: var(--dark-bg);
            border-radius: 10px;
        }
        .avatar-option {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }
        .avatar-option:hover { transform: scale(1.1); border-color: var(--primary); }
        .avatar-option.selected {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }
        .avatar-option img { width: 100%; height: 100%; object-fit: cover; }
        .animation-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            background: var(--dark-bg);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .radio-option:hover { background: var(--dark-border); }
        .radio-option input[type="radio"] { width: 20px; height: 20px; cursor: pointer; }

        /* Voice Recorder */
        .voice-recorder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        .recording-indicator {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 2rem;
            background: var(--danger);
            border-radius: 50px;
            animation: recordingPulse 1s ease-in-out infinite;
        }
        @keyframes recordingPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .recording-dot { animation: dotPulse 1s ease-in-out infinite; }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }
        .voice-controls { display: flex; gap: 1rem; }
        .btn-record {
            width: 80px;
            height: 80px;
            background: var(--gradient-2);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-record:hover { transform: scale(1.1); }
        .voice-preview {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .voice-preview audio { width: 100%; }

        /* Circle Recorder */
        .circle-recorder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        .circle-preview {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--dark-bg);
        }
        .circle-preview video { width: 100%; height: 100%; object-fit: cover; }
        .circle-timer {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .circle-controls { display: flex; gap: 1rem; }
        .circle-preview-result {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
        .circle-preview-result video {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Notifications */
        .notifications-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .notification {
            padding: 1rem 1.5rem;
            background: var(--dark-surface);
            border-radius: 10px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: notificationSlide 0.3s ease-out;
            min-width: 300px;
        }
        @keyframes notificationSlide {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
        .notification.success { border-left: 4px solid var(--success); }
        .notification.error { border-left: 4px solid var(--danger); }
        .notification.info { border-left: 4px solid var(--primary); }
        .notification i { font-size: 1.5rem; }
        .notification.success i { color: var(--success); }
        .notification.error i { color: var(--danger); }
        .notification.info i { color: var(--primary); }

        /* Emoji Picker */
        .emoji-picker {
            position: absolute;
            bottom: 80px;
            left: 20px;
            background: var(--dark-surface);
            border: 1px solid var(--dark-border);
            border-radius: 15px;
            padding: 1rem;
            display: none;
            grid-template-columns: repeat(8, 1fr);
            gap: 0.5rem;
            max-width: 350px;
            box-shadow: var(--shadow-xl);
            z-index: 100;
        }
        .emoji-picker.active { display: grid; }
        .emoji-item {
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            text-align: center;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .emoji-item:hover { background: var(--dark-bg); transform: scale(1.2); }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: fixed; bottom: 0; height: 60px; flex-direction: row; border-right: none; border-top: 1px solid var(--dark-border); }
            .sidebar-header, .sidebar-nav, .group-info { display: none; }
            .main-content { margin-bottom: 60px; }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <h1>Милорды</h1>
                <p>Элитный мессенджер</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginUsername" placeholder="Логин" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="mainScreen" class="screen">
        <aside class="sidebar">
            <div class="sidebar-header">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
            authDomain: "dtv-bank.firebaseapp.com",
            databaseURL: "https://dtv-bank-default-rtdb.firebaseio.com",
            projectId: "dtv-bank",
            storageBucket: "dtv-bank.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = null;
        let currentUserId = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let videoStream = null;
        let recordingInterval = null;
        let circleRecordingInterval = null;
        let notificationsEnabled = true;
        let typingTimeout = null;

        const availableAvatars = [
            'https://api.dicebear.com/7.6/adventurer/svg?seed=Felix',
            'https://api.dicebear.com/7.6/adventurer/svg?seed=Aneka',
            'https://api.dicebear.com/7.6/adventurer/svg?seed=Leo',
            'https://api.dicebear.com/7.6/adventurer/svg?seed=Mia',
            'https://api.dicebear.com/7.6/adventurer/svg?seed=Max',
            'https://api.dicebear.com/7.6/adventurer/svg?seed=Luna',
            'https://api.dicebear.com/7.6/adventurer/svg?seed=Oscar',
            'https://api.dicebear.com/7.6/adventurer/svg?seed=Lily',
            'https://api.dicebear.com/7.6/bottts/svg?seed=Robot1',
            'https://api.dicebear.com/7.6/bottts/svg?seed=Robot2',
            'https://api.dicebear.com/7.6/pixel-art/svg?seed=Pixel1',
            'https://api.dicebear.com/7.6/pixel-art/svg?seed=Pixel2',
            'https://api.dicebear.com/7.6/avataaars/svg?seed=Av1',
            'https://api.dicebear.com/7.6/avataaars/svg?seed=Av2',
            'https://api.dicebear.com/7.6/lorelei/svg?seed=Lor1',
            'https://api.dicebear.com/7.6/lorelei/svg?seed=Lor2'
        ];

        const emojis = ['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','😘','🥰','😗','😙','😚','🙂','🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','🥱','😴','😌','😛','😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','☹️','🙁','😖','😞','😟','😤','😢','😭','😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','🥴','😠','😡','🤬','😷','🤒','🤕','🤢','🤮','🤧','😇','🥳','🥺','🤠','🤡','🤥','🤫','🤭','🧐','🤓'];

        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            initEventListeners();
            initEmojiPicker();
        });

        function checkAuth() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                currentUserId = currentUser.id;
                showMainScreen();
                loadUserData();
                loadMessages();
                loadMembers();
                setupRealtimeListeners();
                updateUserPresence();
            }
        }

        function initEventListeners() {
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('openSettings').addEventListener('click', openSettings);
            document.getElementById('closeSettings').addEventListener('click', closeSettings);
            document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
            document.getElementById('changeAvatarBtn').addEventListener('click', toggleAvatarGrid);
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            document.getElementById('messageInput').addEventListener('input', handleTyping);
            document.getElementById('voiceBtn').addEventListener('click', openVoiceModal);
            document.getElementById('circleBtn').addEventListener('click', openCircleModal);
            document.getElementById('closeVoiceModal').addEventListener('click', closeVoiceModal);
            document.getElementById('closeCircleModal').addEventListener('click', closeCircleModal);
            document.getElementById('startRecording').addEventListener('click', startVoiceRecording);
            document.getElementById('stopRecording').addEventListener('click', stopVoiceRecording);
            document.getElementById('sendVoice').addEventListener('click', sendVoiceMessage);
            document.getElementById('startCircle').addEventListener('click', startCircleRecording);
            document.getElementById('stopCircle').addEventListener('click', stopCircleRecording);
            document.getElementById('sendCircle').addEventListener('click', sendCircleMessage);
            document.getElementById('toggleNotifications').addEventListener('click', toggleNotifications);
            document.getElementById('emojiBtn').addEventListener('click', toggleEmojiPicker);

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const tab = this.getAttribute('data-tab');
                    switchTab(tab);
                });
            });
        }

        function initEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            emojis.forEach(emoji => {
                const span = document.createElement('span');
                span.className = 'emoji-item';
                span.textContent = emoji;
                span.onclick = () => {
                    document.getElementById('messageInput').value += emoji;
                    document.getElementById('messageInput').focus();
                };
                picker.appendChild(span);
            });
        }

        function toggleEmojiPicker() {
            document.getElementById('emojiPicker').classList.toggle('active');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            try {
                const userSnapshot = await database.ref('users').orderByChild('login').equalTo(username).once('value');
                let foundUser = null;
                let foundId = null;

                userSnapshot.forEach(child => {
                    const userData = child.val();
                    if (userData.password === password) {
                        foundUser = userData;
                        foundId = child.key;
                    }
                });

                if (foundUser) {
                    currentUser = { ...foundUser, id: foundId };
                    currentUserId = foundId;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showMainScreen();
                    loadUserData();
                    loadMessages();
                    loadMembers();
                    setupRealtimeListeners();
                    updateUserPresence();
                    showNotification('Добро пожаловать, ' + foundUser.name + '!', 'success');
                    addSystemMessage(foundUser.name + ' вошёл в чат');
                } else {
                    showNotification('Неверный логин или пароль', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showNotification('Ошибка входа: ' + error.message, 'error');
            }
        }

        function showMainScreen() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('mainScreen').classList.add('active');
        }

        function loadUserData() {
            document.getElementById('currentUserName').textContent = currentUser.name || currentUser.login;
            document.getElementById('sidebarAvatar').querySelector('img').src = currentUser.avatar || availableAvatars[0];
            document.getElementById('sidebarAvatar').className = 'avatar animated-avatar ' + (currentUser.animation || 'pulse');
            document.getElementById('settingsAvatar').querySelector('img').src = currentUser.avatar || availableAvatars[0];
            document.getElementById('settingsAvatar').className = 'avatar animated-avatar large ' + (currentUser.animation || 'pulse');
            document.getElementById('settingsName').value = currentUser.name || '';
            document.getElementById('settingsStatus').value = currentUser.status || '';
            const animRadio = document.querySelector(`input[name="animation"][value="${currentUser.animation || 'pulse'}"]`);
            if (animRadio) animRadio.checked = true;
        }

        function loadMessages() {
            database.ref('messages').orderByChild('timestamp').limitToLast(100).once('value').then(snapshot => {
                const messagesContainer = document.getElementById('chatMessages');
                messagesContainer.innerHTML = '';
                snapshot.forEach(child => {
                    const msg = child.val();
                    renderMessage(msg);
                });
                scrollToBottom();
            });
        }

        function loadMembers() {
            database.ref('users').once('value').then(snapshot => {
                const membersList = document.getElementById('membersList');
                membersList.innerHTML = '';
                let onlineCount = 0;
                snapshot.forEach(child => {
                    const user = child.val();
                    if (user.online) onlineCount++;
                    const memberItem = document.createElement('div');
                    memberItem.className = 'member-item';
                    memberItem.innerHTML = `
                        <div class="avatar animated-avatar ${user.animation || 'pulse'}">
                            <img src="${user.avatar || availableAvatars[0]}" alt="${user.name}">
                        </div>
                        <div class="member-info">
                            <h4>${user.name || user.login}</h4>
                            <p>${user.status || (user.online ? 'В сети' : 'Не в сети')}</p>
                        </div>
                        <span class="status ${user.online ? 'online' : ''}">${user.online ? 'Онлайн' : 'Оффлайн'}</span>
                    `;
                    membersList.appendChild(memberItem);
                });
                document.getElementById('onlineCount').textContent = onlineCount + ' участников онлайн';
            });
        }

        function setupRealtimeListeners() {
            database.ref('messages').on('child_added', snapshot => {
                const msg = snapshot.val();
                renderMessage(msg);
                scrollToBottom();
                if (msg.senderId !== currentUserId && notificationsEnabled) {
                    showNotification(msg.senderName + ': ' + (msg.type === 'text' ? msg.text : (msg.type === 'voice' ? '🎤 Голосовое сообщение' : '🎥 Кружочек')), 'info');
                }
            });

            database.ref('users').on('value', snapshot => {
                let onlineCount = 0;
                snapshot.forEach(child => {
                    if (child.val().online) onlineCount++;
                });
                document.getElementById('onlineCount').textContent = onlineCount + ' участников онлайн';
            });

            database.ref('typing').on('value', snapshot => {
                const typingUsers = [];
                snapshot.forEach(child => {
                    if (child.key !== currentUserId) {
                        typingUsers.push(child.val().name);
                    }
                });
                const indicator = document.getElementById('typingIndicator');
                if (typingUsers.length > 0) {
                    indicator.textContent = typingUsers.join(', ') + ' печатает...';
                    indicator.style.display = 'inline';
                } else {
                    indicator.style.display = 'none';
                }
            });
        }

        function renderMessage(msg) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');

            if (msg.type === 'system') {
                messageEl.className = 'system-message';
                messageEl.textContent = msg.text;
            } else {
                const isOwn = msg.senderId === currentUserId;
                messageEl.className = 'message' + (isOwn ? ' own' : '');

                let content = '';
                if (msg.type === 'text') {
                    content = `<div class="message-bubble">${escapeHtml(msg.text)}</div>`;
                } else if (msg.type === 'voice') {
                    content = `<div class="message-bubble voice-message"><audio controls src="${msg.audioUrl}"></audio></div>`;
                } else if (msg.type === 'circle') {
                    content = `<div class="message-bubble circle-message"><video controls src="${msg.videoUrl}"></video></div>`;
                }

                const time = new Date(msg.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                messageEl.innerHTML = `
                    <div class="message-avatar">
                        <img src="${msg.senderAvatar || availableAvatars[0]}" alt="${msg.senderName}">
                    </div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-sender">${msg.senderName}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        ${content}
                    </div>
                `;
            }
            messagesContainer.appendChild(messageEl);
        }

        function addSystemMessage(text) {
            database.ref('messages').push({
                type: 'system',
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            database.ref('messages').push({
                type: 'text',
                text: text,
                senderId: currentUserId,
                senderName: currentUser.name || currentUser.login,
                senderAvatar: currentUser.avatar || availableAvatars[0],
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            input.value = '';
            database.ref('typing/' + currentUserId).remove();
        }

        function handleTyping() {
            database.ref('typing/' + currentUserId).set({
                name: currentUser.name || currentUser.login,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                database.ref('typing/' + currentUserId).remove();
            }, 2000);
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function toggleAvatarGrid() {
            const grid = document.getElementById('avatarGrid');
            if (grid.style.display === 'none') {
                grid.innerHTML = '';
                availableAvatars.forEach((avatar, index) => {
                    const option = document.createElement('div');
                    option.className = 'avatar-option';
                    if (currentUser.avatar === avatar) option.classList.add('selected');
                    option.innerHTML = `<img src="${avatar}" alt="Avatar ${index}">`;
                    option.onclick = () => selectAvatar(avatar);
                    grid.appendChild(option);
                });
                grid.style.display = 'grid';
            } else {
                grid.style.display = 'none';
            }
        }

        function selectAvatar(avatar) {
            document.getElementById('settingsAvatar').querySelector('img').src = avatar;
            document.querySelectorAll('.avatar-option').forEach(opt => opt.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            currentUser.avatar = avatar;
        }

        async function saveSettings() {
            const name = document.getElementById('settingsName').value.trim();
            const status = document.getElementById('settingsStatus').value.trim();
            const animation = document.querySelector('input[name="animation"]:checked').value;

            const updates = {
                name: name || currentUser.login,
                status: status,
                animation: animation,
                avatar: currentUser.avatar
            };

            try {
                await database.ref('users/' + currentUserId).update(updates);
                currentUser = { ...currentUser, ...updates };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                loadUserData();
                closeSettings();
                showNotification('Настройки сохранены', 'success');
            } catch (error) {
                showNotification('Ошибка сохранения: ' + error.message, 'error');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
            if (tab === 'members') loadMembers();
        }

        function openVoiceModal() {
            document.getElementById('voiceModal').classList.add('active');
            document.getElementById('voicePreview').style.display = 'none';
            document.getElementById('recordingIndicator').style.display = 'none';
            document.getElementById('startRecording').style.display = 'block';
            document.getElementById('stopRecording').style.display = 'none';
        }

        function closeVoiceModal() {
            document.getElementById('voiceModal').classList.remove('active');
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    document.getElementById('voiceAudio').src = audioUrl;
                    document.getElementById('voicePreview').style.display = 'flex';
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                document.getElementById('startRecording').style.display = 'none';
                document.getElementById('stopRecording').style.display = 'block';
                document.getElementById('recordingIndicator').style.display = 'flex';

                let seconds = 0;
                recordingInterval = setInterval(() => {
                    seconds++;
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    document.getElementById('recordingTime').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            } catch (error) {
                showNotification('Ошибка доступа к микрофону: ' + error.message, 'error');
            }
        }

        function stopVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            clearInterval(recordingInterval);
            document.getElementById('recordingIndicator').style.display = 'none';
        }

        async function sendVoiceMessage() {
            const audioEl = document.getElementById('voiceAudio');
            const audioUrl = audioEl.src;
            if (!audioUrl) return;

            try {
                const response = await fetch(audioUrl);
                const blob = await response.blob();
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64 = reader.result.split(',')[1];
                    database.ref('messages').push({
                        type: 'voice',
                        audioUrl: 'data:audio/webm;base64,' + base64,
                        senderId: currentUserId,
                        senderName: currentUser.name || currentUser.login,
                        senderAvatar: currentUser.avatar || availableAvatars[0],
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    closeVoiceModal();
                    showNotification('Голосовое сообщение отправлено', 'success');
                };
                reader.readAsDataURL(blob);
            } catch (error) {
                showNotification('Ошибка отправки: ' + error.message, 'error');
            }
        }

        function openCircleModal() {
            document.getElementById('circleModal').classList.add('active');
            document.getElementById('circlePreviewResult').style.display = 'none';
            document.getElementById('startCircle').style.display = 'block';
            document.getElementById('stopCircle').style.display = 'none';
        }

        function closeCircleModal() {
            document.getElementById('circleModal').classList.remove('active');
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        async function startCircleRecording() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('circleVideo').srcObject = videoStream;

                mediaRecorder = new MediaRecorder(videoStream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const videoBlob = new Blob(audioChunks, { type: 'video/webm' });
                    const videoUrl = URL.createObjectURL(videoBlob);
                    document.getElementById('circlePreviewVideo').src = videoUrl;
                    document.getElementById('circlePreviewResult').style.display = 'flex';
                    videoStream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                document.getElementById('startCircle').style.display = 'none';
                document.getElementById('stopCircle').style.display = 'block';

                let seconds = 0;
                circleRecordingInterval = setInterval(() => {
                    seconds++;
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    document.getElementById('circleTimer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                }, 1000);
            } catch (error) {
                showNotification('Ошибка доступа к камере: ' + error.message, 'error');
            }
        }

        function stopCircleRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            clearInterval(circleRecordingInterval);
        }

        async function sendCircleMessage() {
            const videoEl = document.getElementById('circlePreviewVideo');
            const videoUrl = videoEl.src;
            if (!videoUrl) return;

            try {
                const response = await fetch(videoUrl);
                const blob = await response.blob();
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64 = reader.result.split(',')[1];
                    database.ref('messages').push({
                        type: 'circle',
                        videoUrl: 'data:video/webm;base64,' + base64,
                        senderId: currentUserId,
                        senderName: currentUser.name || currentUser.login,
                        senderAvatar: currentUser.avatar || availableAvatars[0],
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                    closeCircleModal();
                    showNotification('Кружочек отправлен', 'success');
                };
                reader.readAsDataURL(blob);
            } catch (error) {
                showNotification('Ошибка отправки: ' + error.message, 'error');
            }
        }

        function toggleNotifications() {
            notificationsEnabled = !notificationsEnabled;
            const icon = document.querySelector('#toggleNotifications i');
            if (notificationsEnabled) {
                icon.className = 'fas fa-bell';
                showNotification('Уведомления включены', 'success');
            } else {
                icon.className = 'fas fa-bell-slash';
                showNotification('Уведомления выключены', 'info');
            }
        }

        function updateUserPresence() {
            database.ref('users/' + currentUserId + '/online').set(true);
            database.ref('users/' + currentUserId + '/online').onDisconnect().set(false);
        }

        function showNotification(message, type = 'info') {
            const container = document.getElementById('notifications');
            const notification = document.createElement('div');
            notification.className = 'notification ' + type;
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle');
            notification.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
            container.appendChild(notification);
            setTimeout(() => {
                notification.style.animation = 'notificationSlide 0.3s ease-out reverse';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('beforeunload', () => {
            if (currentUserId) {
                database.ref('users/' + currentUserId + '/online').set(false);
            }
        });
    </script>
</body>
</html>
